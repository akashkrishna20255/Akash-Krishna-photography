# Cloudflare Configuration for Akash Krishna Portfolio
# Works with both Cloudflare Workers (wrangler deploy) and Cloudflare Pages

name = "gallery-portfolio"
main = "worker/index.ts"
compatibility_date = "2024-09-23"

# Modern Cloudflare Workers Static Assets (serves Vite build output)
[assets]
directory = "./dist"
binding = "ASSETS"

# -------------------------------------------------------------------
# Cloudflare KV Namespace Binding:
# -------------------------------------------------------------------

[[kv_namespaces]]
binding = "PHOTO_KV"
id = "72d66997d3e04ddcb34299f4ab001564"

# NOTE: If deploying via Cloudflare Pages (Pages Dashboard):
# Go to: Settings > Functions > KV namespace bindings > Add binding:
# Variable name: PHOTO_KV -> Select your KV namespace.
