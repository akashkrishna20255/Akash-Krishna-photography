# Cloudflare Configuration for Akash Krishna Portfolio
# Works with both Cloudflare Workers (wrangler deploy) and Cloudflare Pages

name = "gallery-portfolio"
main = "worker/index.ts"
compatibility_date = "2024-09-23"

# Modern Cloudflare Workers Static Assets (serves Vite build output)
[assets]
directory = "./dist"
binding = "ASSETS"

# -------------------------------------------------------------------
# Cloudflare KV Namespace Binding:
# -------------------------------------------------------------------
# To enable persistent Cloudflare KV storage:
#
# STEP 1: Create your KV namespace in Cloudflare:
#   npx wrangler kv namespace create PHOTO_KV
#
# STEP 2: Wrangler will output something like:
#   [[kv_namespaces]]
#   binding = "PHOTO_KV"
#   id = "0123456789abcdef0123456789abcdef"
#
# STEP 3: Uncomment the 3 lines below and replace YOUR_32_CHAR_KV_ID with your real ID:
#
# [[kv_namespaces]]
# binding = "PHOTO_KV"
# id = "YOUR_32_CHAR_KV_ID"
#
# NOTE: If deploying via Cloudflare Pages (Pages Dashboard):
# Go to: Settings > Functions > KV namespace bindings > Add binding:
# Variable name: PHOTO_KV -> Select your KV namespace.
