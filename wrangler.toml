# Cloudflare Wrangler Configuration
name = "gallery-portfolio"
main = "worker/index.ts"
compatibility_date = "2024-01-01"

# Serves static assets produced by Vite (npm run build -> dist)
[site]
bucket = "./dist"

# Cloudflare KV Namespace Binding for Gallery Photos
# To create the KV namespace:
# 1. Run: npx wrangler kv namespace create PHOTO_KV
# 2. Replace "<your-kv-namespace-id>" with the generated namespace ID
[[kv_namespaces]]
binding = "PHOTO_KV"
id = "<your-kv-namespace-id>"
